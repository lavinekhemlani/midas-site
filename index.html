<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Midas — now at gomidas.co</title>
<meta name="description" content="Midas has moved to gomidas.co. Buy a new car, pay monthly, drive in 48 hours." />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="brand/mark.svg" />
<link rel="apple-touch-icon" href="brand/icon-180.png" />
<link rel="canonical" href="https://gomidas.co/" />
<script>
(function(){
  var dest = 'https://gomidas.co/' + location.search + location.hash;
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(regs){ regs.forEach(function(r){ r.unregister(); }); });
    }
    if('caches' in window){ caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); }); }
  }catch(e){}
  document.getElementById('go') && (document.getElementById('go').href = dest);
  location.replace(dest);
})();
</script>
<meta http-equiv="refresh" content="0; url=https://gomidas.co/" />

  body{font-family:-apple-system,BlinkMacSystemFont,"Instrument Sans",system-ui,sans-serif;background:#0d1b2e;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center;padding:24px}
  a{color:#e8b64b}
