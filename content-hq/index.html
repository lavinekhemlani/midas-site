<style>
:root{--bg:#fafaf9;--card:#fff;--line:#e8e8e5;--text:#1a1a18;--muted:#8b8b85;--soft:#f3f3f0;--ok:#2d7a4c;--okbg:#e9f3ed;--warn:#9c5c16;--warnbg:#faf1e5;--bad:#b23b3b;--ink:#161615}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
a{color:inherit}button{font:inherit;font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 14px;min-height:34px}
button:hover{border-color:#cfcfca}button.go{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}button.txt{border:0;background:none;color:var(--muted);padding:4px 6px;min-height:0}button.txt:hover{color:var(--text)}
header{display:flex;align-items:center;gap:4px;padding:14px 32px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-weight:650;margin-right:22px}header nav{display:flex;gap:2px;flex-wrap:wrap}header nav a{padding:6px 11px;border-radius:7px;text-decoration:none;color:var(--text);font-size:14px}header nav a.on{background:var(--soft)}header nav span{padding:6px 11px;color:#c2c2bc;font-size:14px}
header .upd{margin-left:auto;color:var(--muted);font-size:12.5px}
main{max-width:1240px;margin:0 auto;padding:36px 32px 70px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{font-size:34px;margin:4px 0 8px;font-weight:650;letter-spacing:-.015em}
.sum{font-size:16.5px;color:#3b3b38;max-width:760px;margin:0 0 24px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:24px}
.stats>div{padding:16px 20px;border-left:1px solid var(--line)}.stats>div:first-child{border-left:0}.stats .v{font-size:26px;font-weight:650;margin:2px 0 0;letter-spacing:-.01em}.stats small{color:var(--muted);font-size:12.5px}.stats small.w{color:var(--warn)}.stats small.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.lab{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;align-items:center}.lab .r{margin-left:auto;letter-spacing:0;text-transform:none;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.chip{border:1px solid var(--line);border-radius:20px;padding:3px 12px;background:var(--card);font-size:13px;min-height:0}.chip.on{border-color:var(--ink)}.chip i{font-style:normal;color:var(--muted);margin-left:5px}
.need{border-color:#ecd9c2;background:#fffaf3}.need .lab{color:var(--warn)}.need p{margin:0 0 8px}.need code{font-size:12px;background:var(--warnbg);padding:1px 5px;border-radius:4px}
.d{padding:16px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}.lab+.chips+.d,.lab+.d{border-top:0}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}.meta b{color:var(--text)}
.tag{font-size:11.5px;border-radius:5px;padding:1px 7px;background:var(--soft)}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.w{background:var(--warnbg);color:var(--warn)}
.t{grid-column:1/-1;white-space:pre-wrap;cursor:pointer}.t.long{max-height:7.8em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent)}.t.open{max-height:none;-webkit-mask-image:none}
.acts{display:flex;gap:6px;align-self:center}
.d.edit{grid-template-columns:1fr}.d.edit textarea{grid-column:1/-1}
textarea{width:100%;min-height:240px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:12px}
.n{font-size:13px;margin-top:4px}.n.w{color:var(--warn)}.n.ok{color:var(--ok)}
.wk{display:grid;grid-template-columns:78px repeat(7,1fr);gap:4px;align-items:center;font-size:12.5px}.wk .h{text-align:center;color:var(--muted);font-size:11px;line-height:1.3}.wk .h.td{color:var(--text);font-weight:700}
.slot{height:24px;border-radius:6px;border:1px dashed #d8d8d2;font-size:10.5px;color:var(--muted);display:flex;align-items:center;justify-content:center}.slot.f{background:var(--okbg);border:1px solid #bcd9c6;color:var(--ok)}.slot.past{opacity:.4}.slot.x{border:0}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:36px;font:inherit;background:var(--bg)}
.small{font-size:12.5px;color:var(--muted)}.li{display:flex;gap:10px;padding:8px 0;font-size:13.5px;border-top:1px solid var(--line)}.li:first-child{border-top:0}.li .w{color:var(--muted);flex:0 0 100px}.li a{text-decoration:none}.li a:hover{text-decoration:underline}
.foot{color:var(--muted);font-size:12.5px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}.toast.show{opacity:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.cal .day h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}.cal .day.td h4{color:var(--text);font-weight:700}
.it{border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:6px;font-size:12px;line-height:1.35;background:var(--card)}.it b{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:2px}
.it.e{border-style:dashed;color:#b9b9b3;background:transparent}.it.pl{background:#fff8ec;border-color:#efdcbc}.it.ap{background:var(--okbg);border-color:#bcd9c6}.it.po{background:#f1f1ee}.it.past{opacity:.45}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media(max-width:900px){.cal{grid-template-columns:1fr}.cal .day{display:grid;grid-template-columns:70px 1fr;gap:6px}}
@media(max-width:900px){header{padding:12px 16px}header nav span{display:none}main{padding:22px 16px 60px}h1{font-size:28px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats>div{border-left:0;border-top:1px solid var(--line)}.stats>div:nth-child(-n+2){border-top:0}.stats>div:nth-child(5){display:none}
 .d{grid-template-columns:1fr}.d .acts{order:3}.acts button{flex:1;min-height:42px}.sum{font-size:16px}}
</style></head><body>

<script>window.STATIC_DATA={"ahead":{"days":["2026-11-28","2026-11-29","2026-11-30","2026-12-01","2026-12-02","2026-12-03","2026-12-04"],"slots":[{"channel":"x","day":"2026-11-28","time":"17:00","slot":"2026-11-28T17:00","filled":true,"past":true},{"channel":"x","day":"2026-11-29","time":"17:00","slot":"2026-11-29T17:00","filled":true,"past":false},{"channel":"linkedin","day":"2026-11-30","time":"10:00","slot":"2026-11-30T10:00","filled":true,"past":false},{"channel":"x","day":"2026-11-30","time":"17:00","slot":"2026-11-30T17:00","filled":true,"past":false},{"channel":"x","day":"2026-12-01","time":"17:00","slot":"2026-12-01T17:00","filled":true,"past":false},{"channel":"instagram","day":"2026-12-01","time":"19:00","slot":"2026-12-01T19:00","filled":false,"past":false},{"channel":"tiktok","day":"2026-12-01","time":"19:30","slot":"2026-12-01T19:30","filled":false,"past":false},{"channel":"linkedin","day":"2026-12-02","time":"10:00","slot":"2026-12-02T10:00","filled":true,"past":false},{"channel":"x","day":"2026-12-02","time":"17:00","slot":"2026-12-02T17:00","filled":true,"past":false},{"channel":"x","day":"2026-12-03","time":"17:00","slot":"2026-12-03T17:00","filled":true,"past":false},{"channel":"linkedin","day":"2026-12-04","time":"10:00","slot":"2026-12-04T10:00","filled":true,"past":false},{"channel":"x","day":"2026-12-04","time":"17:00","slot":"2026-12-04T17:00","filled":true,"past":false},{"channel":"instagram","day":"2026-12-04","time":"19:00","slot":"2026-12-04T19:00","filled":false,"past":false},{"channel":"tiktok","day":"2026-12-04","time":"19:30","slot":"2026-12-04T19:30","filled":false,"past":false}]},"drafts":[{"id":"2026-11-26-L1","key":"L1","track":"zenith","channel":"linkedin","text":"Insurance covers a borrower who can't pay. It doesn't cover one who decides not to.\n\nMost emerging market structures break on that line.\n\nI was in a financing this week with local currency revenue and dollar debt. A public agency was going to guarantee minimum revenue. On paper, strong. In practice it was a memorandum, not a commitment, and the payment history was 14 years of waiting.\n\nSo we went to the insurer. Inability to pay is insurable. Arbitrary non-payment by a government is not.\n\nSo we went to the hedge. A rolling forward costs about 7% and likely isn't available at size. A non-deliverable forward settles net in cash, which does nothing when the central bank controls dollar conversion.\n\nEach layer was meant to cover the one before it. Each one had a hole in exactly the place the risk lives.\n\nThe fix is not a cleverer layer. It is a smaller deal, a senior piece the lender can actually underwrite, and a junior piece priced for the risk nobody can remove.\n\nA guarantee you can't enforce is a hope with a letterhead.","score":8.6,"created":"2026-11-26","status":"open","slot":"2026-12-04T10:00","url":null,"error":null},{"id":"2026-11-26-L2","key":"L2","track":"zenith","channel":"linkedin","text":"The sponsor didn't want to own the collateral. The lender wouldn't lend unless someone did.\n\nThis stalled a vehicle financing I worked on this week. The sponsor wanted no liability, no equity and no assets on its books. Just the upside of running the fleet.\n\nThen the insurer said it needed an asset owner before it would write the guarantee. The export lender wanted 2.5x asset coverage. The local bank would not even talk until 20% equity was in.\n\nThree different counterparties asked for one thing. Someone has to be on the hook.\n\nThe revised plan is plain. A ring-fenced entity owns the vehicles. It sits under the parent but away from the core liabilities. The lender can repossess, the insurer has an owner to insure, and the sponsor's other businesses stay clear.\n\nIt took weeks to get there because everyone was hunting for a version where nobody owned anything.\n\nThat version doesn't exist. Credit moves risk, and risk has to land on a balance sheet. You only choose which one and how clean you make it.\n\nFounders ask me how to raise debt without giving anything up.\n\nIf you won't hold the risk, you are asking someone else to hold it for free.","score":8.4,"created":"2026-11-26","status":"open","slot":null,"url":null,"error":null},{"id":"2026-11-26-X1","key":"X1","track":"zenith","channel":"x","text":"Rev share beats cost-plus. When you split revenue, neither side has to calculate or audit the other's costs. Most partnership fights are an argument about whose costs are real.","score":7.8,"created":"2026-11-26","status":"open","slot":"2026-11-30T17:00","url":null,"error":null},{"id":"2026-11-26-X2","key":"X2","track":"zenith","channel":"x","text":"Own the book, rent the license. The loans, the origination and the marketing are yours. The bank is just the licensed rails. Most lending partnerships get this backwards and hand the borrower to whoever holds the charter.","score":7.7,"created":"2026-11-26","status":"open","slot":"2026-12-01T17:00","url":null,"error":null},{"id":"2026-11-26-X3","key":"X3","track":"zenith","channel":"x","text":"Most small credit funds don't die on returns. They die on runway before AUM gets big enough for fees to cover costs. Around 50 to 75M the burn mostly stops mattering. Until then the job is surviving, not performing.","score":7.6,"created":"2026-11-26","status":"open","slot":"2026-12-02T17:00","url":null,"error":null},{"id":"2026-11-27-L1","key":"L1","track":"zenith","channel":"linkedin","text":"15% from a hotel developer looks like a great deal.\n\n18% looks even better.\n\nThen nobody forecast the UAE sitting under 2,000 missiles. Or think about lending to a shipping company and Hormuz closes for 6 months. Revenue stops overnight.\n\nThe coupon didn't change. The risk did.\n\nI keep seeing this with credit funds in the US and Australia. A lot of direct lending, priced for the world as it looked the day the term sheet was signed.\n\nThe question I care about now isn't the rate. It's what I can take back.\n\nReceivables. Equipment. Aircraft engines. A first lien on something real, and a team that knows how to go and get it.\n\nOver 5 years, some of these loans will go bad. That's not pessimism. It's the base rate.\n\nThe lender who planned for that takes the engines, re-leases them, and carries on with business as normal.\n\nThe lender who only priced the yield finds out what an unsecured 18% is really worth.\n\nYield is what you're promised. Recourse is what you get paid.","score":8.4,"created":"2026-11-27","status":"open","slot":"2026-11-30T10:00","url":null,"error":null},{"id":"2026-11-27-L2","key":"L2","track":"zenith","channel":"linkedin","text":"\"Hi, I do CFO for businesses.\"\n\nThat was how I introduced myself for 12 months. Nobody knew what to do with it.\n\nI was doing a bit of everything. Bookkeeping, which someone will do for $5 an hour. CFO work for small companies. Whatever came in.\n\nAnd every client ended up saying some version of the same sentence.\n\n\"This is cool, but I just want to raise debt.\"\n\nSo I picked debt.\n\nNow the intro is: I help businesses doing $10 to $25 million in revenue raise around $10 million of asset-based finance, on a 2 to 4 year tenor.\n\nThat one sentence changed things on both sides of the table.\n\nFounders know in 5 seconds if it's them. You want $10M for your business? I call 20 lenders so you don't have to.\n\nLenders changed too. Banks and credit funds know what I bring them now, and they pick up the phone because the deals fit.\n\nThe last 6 months had more momentum than the 12 before them. Same person. Same network. Different sentence.\n\nA friend asked me this week how to fix their advisory business. They wanted to do value creation, transformation and strategy all at once.\n\nI told them what took me a year to hear. Pick the one thing a client actually pays to get done.\n\nA generalist gets referrals from nobody. A lane gets calls from both sides of the table.","score":8.3,"created":"2026-11-27","status":"open","slot":"2026-12-02T10:00","url":null,"error":null},{"id":"2026-11-27-X1","key":"X1","track":"zenith","channel":"x","text":"I built a fintech tool. $50K in customer commitments. Then the customers started saying Claude can do it better. Software gets replaced in a quarter. A lending licence doesn't.","score":8,"created":"2026-11-27","status":"open","slot":"2026-11-27T17:00","url":null,"error":null},{"id":"2026-11-27-X2","key":"X2","track":"zenith","channel":"x","text":"Lenders look at two things. Ability to pay and willingness to pay. A balance sheet only tells you about the first one.","score":7.9,"created":"2026-11-27","status":"open","slot":"2026-11-28T17:00","url":null,"error":null},{"id":"2026-11-27-X3","key":"X3","track":"zenith","channel":"x","text":"Chinese banks wanted 2.5x asset cover. The sponsor's balance sheet couldn't show it. The fix wasn't a stronger balance sheet. It was an insurance bond that pays if the borrower doesn't, with the asset ring-fenced in an SPV.","score":7.7,"created":"2026-11-27","status":"open","slot":"2026-11-29T17:00","url":null,"error":null},{"id":"m-4a67918f","key":"","track":"zenith","channel":"linkedin","text":"Most people know private credit. Depending on who counts, funds hold about $2 to $3.5 trillion.\n\nAsset-based finance is a much bigger market. Apollo puts it at about $20 trillion. That's the size of the market, not what funds hold today, and most of it still sits with banks.\n\nThe idea is simple. You lend against assets that pay you back, not against a company's story. Car loans. Equipment. Invoices. Royalties. A credit line to a lender, secured on its own loan book.\n\nIt changes the question. In corporate credit you ask whether you believe the company. In asset-based credit you ask whether you believe the pool.\n\nThat's why the boring parts matter most. Can I see the loan tape, one row per loan? What were losses by vintage? Who collects if the lender fails? What happens when a borrower defaults?\n\nOutside the US this market is barely structured. A lender in Lagos or Jakarta can have thousands of loans that perform and still be told it's too small for a bank and too complex for a local fund.\n\nThe capital exists. The assets exist. What's missing is the packaging.\n\nThe collateral and the structure matter more than the headline yield.","score":null,"created":"2026-11-27","status":"posted","slot":null,"url":"https://www.linkedin.com/feed/update/urn:li:share:7531958353447755778/","posted_at":"2026-11-27T05:53:56.765Z","error":null},{"id":"m-92d28f4f","key":"","track":"zenith","channel":"x","text":"Thread (5 tweets)\n\nEveryone talks about private credit. Depending on who counts, it's about $2 to $3.5 trillion.\n\nAsset-based finance is a much bigger market. Apollo puts it at about $20 trillion.\n\nMost people have never heard the term. Here's what it is 🧵\n\n---\n\nThe idea is simple.\n\nYou lend against assets that pay you back, not against a company's story.\n\nCar loans. Equipment. Invoices. Royalties. A credit line to a lender, secured on its own loan book.\n\n---\n\nIt changes the question.\n\nCorporate credit: do I believe the company?\nAsset-based credit: do I believe the pool?\n\n---\n\nThat's why the boring parts matter most.\n\nCan I see the loan tape, one row per loan?\nWhat were losses by vintage?\nWho collects if the lender fails?\nWhat happens when a borrower defaults?\n\n---\n\nOutside the US this market is barely structured. A lender in Lagos or Jakarta can have thousands of loans that perform and still be too small for a bank and too complex for a local fund.\n\nThe capital exists. The assets exist. What's missing is the packaging.","score":null,"created":"2026-11-27","status":"posted","slot":null,"url":"https://x.com/Lavinehemlani/status/2126196831625367992","posted_at":"2026-11-27T06:52:03.181Z","error":null},{"id":"m-c283bf8b","key":"","track":"zenith","channel":"linkedin","text":"Heard Marc Rowan say a bank is the best way to borrow short and the wrong place to borrow long.\n\nMost founders I sit with get this backwards.\n\nThey need five to seven year money. For a fleet, a plant, a receivables book that keeps growing.\n\nSo they go to their bank. The bank offers a 12 month facility, renewable, with covenants tested every quarter.\n\nIt looks cheap. It is cheap. Until the renewal lands in a bad quarter.\n\nBanks fund themselves with deposits that can leave tomorrow. Of course they want their money back fast. That is not them being difficult. That is their balance sheet.\n\nLong money sits elsewhere. Insurers. Pension pools. Family offices. Specialty credit funds. Capital that actually wants to be tied up for years.\n\nBefore I look at rate, I ask three questions.\n\nHow long does the asset take to pay you back?\nHow long is the money you're being offered?\nWho is lending it, and how do they fund themselves?\n\nIf the first two answers don't match, the rate doesn't matter.\n\nCheap short money on a long asset isn't a saving. It's a refinancing risk you chose to carry.","score":null,"created":"2026-11-27","status":"open","slot":null,"url":null,"error":null},{"id":"m-bdc3cc76","key":"","track":"zenith","channel":"linkedin","text":"A $1bn revenue headline and a lender's first question are two different things.\n\nSaw the Fuse Energy news this week. Huge growth. Fair play to them.\n\nBut the best line wasn't in the post. It was in the comments. An energy supplier sells a regulated commodity on thin margins, and customers leave the moment a cheaper tariff shows up.\n\nThat's the question I ask every founder who comes to me for debt.\n\nNot how big is the revenue. How sticky is it, and what's left after you pay to win it.\n\nEquity can price the story. Credit can't.\n\nA lender looks at:\nMargin per customer\nHow many leave at renewal\nHow long it takes to earn back what you paid to win them\nWhether cash lands before the next bill is due\n\nRevenue that resets every 12 months is a different asset from revenue locked into contracts. Same number on the deck. Very different facility.\n\nIf you're raising debt next year, put your cohort data on page one. Not your ARR.\n\nBig revenue gets you the meeting. Revenue that stays gets you the term sheet.","score":null,"created":"2026-11-27","status":"open","slot":null,"url":null,"error":null},{"id":"m-1a4ba5f6","key":"","track":"dj","channel":"instagram","text":"Carousel (6 slides): The biggest market in finance has no famous logo.\n\nPrivate credit gets the headlines at $3T. Asset-based finance is $20T, and it's how lenders grow without selling a single share.\n\nStop selling your company. Sell your assets.\n\nThe 4 questions every lender asks are on the last slide. Save it for your next raise.\n\n#privatecredit #assetbasedfinance #fintech","score":null,"created":"2026-11-27","status":"posted","slot":null,"url":"https://www.instagram.com/p/DgPWcrrDCwn/","posted_at":"2026-11-27T09:24:23.918Z","error":null},{"id":"2026-11-28-X1","key":"X1","track":"zenith","channel":"x","text":"Marc Rowan: a bank is the best way to borrow short and the wrong place to borrow long.\n\nBank money is deposits that can leave tomorrow. Your loan book runs for years.\n\nBorrow for as long as the asset lives. Anything shorter is a refinancing you don't control.","score":8.1,"created":"2026-11-28","status":"open","slot":"2026-12-03T17:00","url":null,"error":null},{"id":"2026-11-28-X2","key":"X2","track":"zenith","channel":"x","text":"Two weeks ago I shared one deal in a few groups.\n\n14 companies said yes.\n4 have already dropped.\n10 are still in progress.\nClosed: zero.\n\nA yes is not a deal. Put a percentage next to every yes, or stop counting it.","score":8,"created":"2026-11-28","status":"open","slot":"2026-12-04T17:00","url":null,"error":null},{"id":"2026-11-28-X3","key":"X3","track":"zenith","channel":"x","text":"Nobody has ever hired a CFO because they love accounting.\n\nThey hire one because a raise or an acquisition is coming.\n\nIf your CFO can't raise you money, you hired an expensive bookkeeper.","score":7.9,"created":"2026-11-28","status":"open","slot":null,"url":null,"error":null},{"id":"m-dec03a62","key":"","track":"zenith","channel":"linkedin","text":"Count the no's, not the yes's.\n\nHeard Greg Lav tell a story this week. A sales floor started every morning with \"let's go get some no's.\"\n\nThat is capital raising.\n\nEvery founder I work with wants the yes. Few are willing to sit in the no's long enough to earn it.\n\nA lender passes because your collateral doesn't fit their box. A family office passes because the cheque size is wrong. A fund passes because it's Q4.\n\nNone of that is about you. It's about fit.\n\nWhat I tell founders now:\n\nWrite down the five people you're afraid will watch you get turned down. Look at the list. Most of them aren't building anything.\n\nThen send the 50 emails.\n\nBuilding from Dubai, I'm surrounded by people who have heard no a hundred times and are still dialing. That changes how a no feels. It stops being shame and starts being data.\n\nIf the people around you make a no feel like a verdict, change the room.\n\nThe no costs you an afternoon. Being afraid of it costs you the raise.","score":null,"created":"2026-11-28","status":"open","slot":null,"url":null,"error":null},{"id":"m-dabca835","key":"","track":"zenith","channel":"linkedin","text":"Most founders who ask me for capital don't have a capital problem.\n\nThey have one number that's off.\n\nHeard Cameron England fix a business live. His first question wasn't about growth. It was: is this supply or demand?\n\nThen he wrote the month as a plan, filled in actuals every week, and looked for the number furthest from target. Fix that one. Leave the rest.\n\nI run the same test before I help anyone raise.\n\nWrite the month as a chain. Leads, meetings, conversions, cash collected, cash out.\nPut plan next to actual.\nFind the biggest gap.\n\nIf the gap is demand, the money buys a bigger version of the same leak.\nIf the gap is collections, a lender will spot it in the first data request.\nIf the gap is delivery, you're raising to scale a bottleneck.\n\nSometimes the honest answer is you don't need the round yet. You need one fix and ninety days.\n\nCapital multiplies whatever is working.\n\nIt multiplies whatever is broken too.","score":null,"created":"2026-11-28","status":"open","slot":null,"url":null,"error":null},{"id":"m-e99aea78","key":"","track":"zenith","channel":"linkedin","text":"No lender has ever asked me how I see myself.\n\nThere is a whole industry now selling founders a new identity.\nVisualise the house. Feel the certainty. Money will come.\n\nI get the appeal. Confidence matters in a room.\nPeople feel it when you believe in what you are building.\n\nBut I sit on both sides of capital conversations.\nAnd nobody on the other side is underwriting your mindset.\n\nThey ask what the cash flow looks like.\nWho pays, how often, and what happens when they don't.\nWhat you did last time it went wrong.\n\nThe founders I see raise well are not the most certain.\nThey are the most specific.\nThey know their numbers cold and say the bad parts first.\n\nCertainty without proof makes a credit committee nervous.\nProof with no certainty still gets funded.\n\nSo if you want a morning ritual, here is mine.\nWrite down one thing you can prove today that you could not prove yesterday.\n\nIdentity follows the track record.\nNever the other way round.","score":null,"created":"2026-11-28","status":"open","slot":null,"url":null,"error":null}],"archived":5,"week":{"days":["2026-11-23","2026-11-24","2026-11-25","2026-11-26","2026-11-27","2026-11-28","2026-11-29"],"slots":[{"channel":"linkedin","day":"2026-11-23","time":"10:00","slot":"2026-11-23T10:00","filled":false,"past":true},{"channel":"x","day":"2026-11-23","time":"17:00","slot":"2026-11-23T17:00","filled":false,"past":true},{"channel":"x","day":"2026-11-24","time":"17:00","slot":"2026-11-24T17:00","filled":false,"past":true},{"channel":"linkedin","day":"2026-11-25","time":"10:00","slot":"2026-11-25T10:00","filled":false,"past":true},{"channel":"x","day":"2026-11-25","time":"17:00","slot":"2026-11-25T17:00","filled":false,"past":true},{"channel":"x","day":"2026-11-26","time":"17:00","slot":"2026-11-26T17:00","filled":false,"past":true},{"channel":"linkedin","day":"2026-11-27","time":"10:00","slot":"2026-11-27T10:00","filled":false,"past":true},{"channel":"x","day":"2026-11-27","time":"17:00","slot":"2026-11-27T17:00","filled":true,"past":true},{"channel":"x","day":"2026-11-28","time":"17:00","slot":"2026-11-28T17:00","filled":true,"past":true},{"channel":"x","day":"2026-11-29","time":"17:00","slot":"2026-11-29T17:00","filled":true,"past":false}]},"missed":["2026-11-27-X1","2026-11-27-X2"],"keys":{"linkedin":[],"x":[],"instagram":["UPLOAD_POST_API_KEY"],"tiktok":["UPLOAD_POST_API_KEY"],"youtube":["UPLOAD_POST_API_KEY"]},"label":{"linkedin":"LinkedIn","x":"X","instagram":"Instagram","tiktok":"TikTok","youtube":"YouTube"},"paste":[{"at":"2026-11-28T18:53:04","text":"Angle from Ebrahim Turner: No lender has ever asked me how I see myself. (https://www.youtube.com/watch?v=kR8t8xQbtZI)"},{"at":"2026-11-28T18:52:54","text":"Angle from Cameron England: Most founders who ask me for capital don't have a capital problem. (https://www.youtube.com/watch?v=KjwVPlM5gjc)"},{"at":"2026-11-28T18:52:41","text":"Angle from Greg Lav (Bloom Nutrition co-founder): Count the no's, not the yes's. (https://www.youtube.com/watch?v=FcEyCJqUdkk)"},{"at":"2026-11-27T11:24:46","text":"Angle from Sandy Willis (LinkedIn post on Fuse Energy, co-founders Charles Orr and Alan Chang): A $1bn revenue headline and a lender's first question are two different things. (https://lnkd.in/p/dRVpqdmt)"},{"at":"2026-11-27T11:24:38","text":"Angle from Marc Rowan, CEO of Apollo Global (interviewed by Robert Frank, CNBC): Heard Marc Rowan say a bank is the best way to borrow short and the wrong place to borrow long. (https://www.youtube.com/watch?v=-aUZaYVAWDA)"}],"inspo":[{"at":"2026-11-28T18:53","url":"https://www.youtube.com/watch?v=kR8t8xQbtZI","kind":"watch-later","title":"Lenders don't underwrite your identity","who":"Ebrahim Turner","summary":"A guided hypnosis that has you picture yourself as a billionaire: the confidence, the house, the cars, the gratitude. It says money and action become easy once you take on that identity, and that you should replay it every morning and night.","hook":"No lender has ever asked me how I see myself.","score":5.8,"channel":"linkedin"},{"at":"2026-11-28T18:52","url":"https://www.youtube.com/watch?v=KjwVPlM5gjc","kind":"watch-later","title":"One number off, not a capital problem","who":"Cameron England","summary":"Cameron England takes apart a USD 92K a month coaching business live. His first question is whether growth is held back by supply or by demand. He then sets a monthly plan, fills in the actual numbers each week and fixes only the number furthest from target, while keeping a record of why each client bought.","hook":"Most founders who ask me for capital don't have a capital problem.","score":7.8,"channel":"linkedin"},{"at":"2026-11-28T18:52","url":"https://www.youtube.com/watch?v=FcEyCJqUdkk","kind":"watch-later","title":"watch this before you enter 2027","who":"Greg Lav (Bloom Nutrition co-founder)","summary":"Most people who hold back from their goals are scared of being judged, and usually by people whose lives they don't even want. Lav's answer: get used to hearing no, put a number on your no's the way a sales floor does, write your fears down, and surround yourself with people who laugh off the losses with you.","hook":"Count the no's, not the yes's.","score":7.4,"channel":"linkedin"},{"at":"2026-11-27T11:24","url":"https://lnkd.in/p/dRVpqdmt","kind":"article","title":"Lenders don't underwrite ARR, they underwrite what stays","who":"Sandy Willis (LinkedIn post on Fuse Energy, co-founders Charles Orr and Alan Chang)","summary":"Fuse Energy, a UK energy supplier, has passed $1bn ARR after $300m last September and a $5bn valuation, and its co-founder has written into the company's documents that VCs cannot fire him. The sharpest point is in the comments: ARR means little for a thin-margin utility whose customers switch at every renewal.","hook":"A $1bn revenue headline and a lender's first question are two different things.","score":7.4,"channel":"linkedin"},{"at":"2026-11-27T11:24","url":"https://www.youtube.com/watch?v=-aUZaYVAWDA","kind":"youtube","title":"Inside Alts: Why Apollo's CEO thinks your investment strategy is broken","who":"Marc Rowan, CEO of Apollo Global (interviewed by Robert Frank, CNBC)","summary":"Rowan argues that public vs private is really a question of liquidity, not of safe vs risky, and that most long-dated financing will move out of banks to insurers, pensions and private credit. CFOs now pick from three kinds of capital: banks for short money, bond markets for plain vanilla, and private markets for long-dated or bespoke terms.","hook":"Heard Marc Rowan say a bank is the best way to borrow short and the wrong place to borrow long.","score":8.2,"channel":"linkedin"}],"focus":[{"id":"1dd214cb28","pillar":"philosophy","hook":"Charlie Munger died three years ago today. The rule of his I use most is one word: invert.","idea":"Before you pitch a lender, write every reason they'd say no and fix that list first.","proof":"Munger died 28 Nov 2023. Same-day hooks break out 43% vs 18%.","theme":"same-day + flat claim","close":"Most raises fail on a no you could have predicted.","channel":"linkedin","added":"2026-11-28T10:06","sources":["Munger died 28 Nov 2023 (public record)"]},{"id":"d60af41f95","pillar":"credit","hook":"Blackstone and Apollo both capped withdrawals at 5% again last quarter. The gate was in the documents from day one.","idea":"Retail read the yield and skipped the terms. Founders raising facilities do the same.","proof":"Verified 28 Nov: Apollo ADS capped at 5% in Sept after 14.7% asked to exit (Bloomberg); BCRED capped at 5% in Q3 after ~10% (CNBC/Bloomberg). Cap is in the offering docs.","theme":"X just did Y","close":"The price is what you read. The terms are what you live with.","channel":"linkedin","added":"2026-11-28T10:06","sources":["https://www.bloomberg.com/news/articles/2026-09-22/apollo-caps-private-credit-fund-again-after-14-7-look-to-exit","https://www.cnbc.com/2026/06/23/apollo-private-credit-fund-withdrawals-redemptions.html"]},{"id":"d2fcf0d3a1","pillar":"credit","hook":"The cost of capital cheat sheet: 8 ways to borrow in 2026, and what each one really costs.","idea":"Free asset carousel: bank, bonds, venture debt, revenue-based, asset-backed, lender finance, private credit, equity. Tenor, price, what they ask for.","proof":"Price ranges must come from his own deals or a cited source; no number goes in without one.","theme":"free asset","close":"Pick by tenor, not by headline rate.","channel":"linkedin","added":"2026-11-28T10:06"},{"id":"30a084138f","pillar":"business","hook":"MENA startups raised $40M in October. Down 96% from September.","idea":"With equity this dry, founders with real assets or a loan book can raise against the balance sheet instead of selling more of the company.","proof":"Verified 28 Nov: Wamda, 32 startups, $40M vs $1.1B Sept; YTD ~$3.4B vs record $7.5B in 2025.","theme":"one number + reframe","close":"Equity winters are debt summers.","channel":"linkedin","added":"2026-11-28T10:06","sources":["https://www.wamda.com/2026/11/mena-startup-funding-plunges-96-40-million-october-2026-megadeals-dry"]}],"nextFree":{"channel":"instagram","day":"2026-12-01","time":"19:00","slot":"2026-12-01T19:00"},"free":{"linkedin":["2026-12-07T10:00","2026-12-09T10:00","2026-12-11T10:00"],"x":["2026-12-05T17:00","2026-12-06T17:00","2026-12-07T17:00","2026-12-08T17:00","2026-12-09T17:00","2026-12-10T17:00","2026-12-11T17:00","2026-12-12T17:00","2026-12-13T17:00"],"instagram":["2026-12-01T19:00","2026-12-04T19:00","2026-12-06T19:00","2026-12-08T19:00","2026-12-11T19:00","2026-12-13T19:00"],"tiktok":["2026-12-01T19:30","2026-12-04T19:30","2026-12-08T19:30","2026-12-11T19:30"],"youtube":["2026-12-06T19:30","2026-12-13T19:30"]},"now":"2026-11-28T14:53:24.569Z"};</script>
<script>
const $=s=>document.querySelector(s);let V=null,editing=null,openT=new Set();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),3500)};
async function api(p,m='GET',b){const r=await fetch('/api/content'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const when=s=>{const d=new Date(s.slice(0,10)+'T12:00:00Z');return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${s.slice(11,16)}`};
const todayD=()=>new Date(Date.now()+4*36e5).toISOString().slice(0,10);
// Static copy on midascfo.com/content-hq (window.STATIC_DATA baked in by content.js): buttons open WhatsApp with the command typed, he sends it to himself
const STATIC=!!window.STATIC_DATA;
const ref=d=>(d.key||d.id)+(d.created===todayD()?'':'@'+(+d.created.slice(8)));
const wa=t=>{location.href='https://wa.me/?text='+encodeURIComponent(t)};
async function load(){if(STATIC){V=window.STATIC_DATA;render();return}try{V=await api('');render()}catch(e){$('#sum').textContent='Could not load: '+e.message}}
let filter='all';
function render(){
  const D=V.drafts,L=V.label,missed=new Set(V.missed),W=V.week.slots;
  const open=D.filter(d=>d.status==='open'&&!missed.has(d.id)).sort((a,b)=>(b.created>a.created?1:b.created<a.created?-1:0)||(a.channel==='linkedin'?-1:1)-(b.channel==='linkedin'?-1:1)||(b.score||0)-(a.score||0));
  const appr=D.filter(d=>['approved','posting'].includes(d.status)&&!missed.has(d.id)).sort((a,b)=>a.slot>b.slot?1:-1);
  const posted=D.filter(d=>d.status==='posted').sort((a,b)=>(b.posted_at||'')>(a.posted_at||'')?1:-1);
  const filled=W.filter(s=>s.filled).length,need=['linkedin','x'].filter(ch=>V.keys[ch].length),ms=D.filter(d=>missed.has(d.id));
  const wk=V.week.days[0],postedWk=posted.filter(d=>(d.posted_at||'').slice(0,10)>=wk);
  const lastOf=ch=>posted.find(d=>d.channel===ch);
  const dd=s=>{const x=new Date((s||'').slice(0,10)+'T12:00:00Z');return isNaN(x)?'':`${x.getUTCDate()} ${MON[x.getUTCMonth()]}`};
  // the one sentence
  let s=`${open.length?`${open.length} draft${open.length>1?'s':''} waiting`:'No drafts waiting'}${appr.length?`, ${appr.length} approved and queued`:''}. `;
  s+=postedWk.length?`${postedWk.length} posted this week${lastOf('linkedin')?`, the last LinkedIn post on ${dd(lastOf('linkedin').posted_at)}`:''}.`:'Nothing posted yet this week.';
  s+=need.length?` ${need.map(c=>L[c]).join(' and ')} not connected yet.`:appr.length?` Next out: ${L[appr[0].channel]} ${when(appr[0].slot)}.`:open.length?' Approve one and it goes out in the next free slot.':'';
  $('#sum').textContent=s;
  $('#upd').textContent=STATIC?`Updated ${new Date(V.now).toLocaleString('en-GB',{timeZone:'Asia/Dubai',weekday:'short',hour:'2-digit',minute:'2-digit'})}`:'';
  const li=lastOf('linkedin'),xx=lastOf('x'),td=todayD();
  $('#stats').innerHTML=`<div><div class="eyebrow">Waiting</div><div class="v">${open.length}</div><small>${open.filter(d=>d.created===todayD()).length} new today</small></div>
   <div><div class="eyebrow">This week</div><div class="v">${postedWk.length} posted</div><small class="${appr.length?'ok':''}">${appr.length} queued · ${filled} of ${W.length} slots</small></div>
   <div><div class="eyebrow">LinkedIn</div><div class="v">${li?dd(li.posted_at):'–'}</div><small>${li?'last post':'nothing yet'} · 3 a week</small></div>
   <div><div class="eyebrow">X</div><div class="v">${xx?dd(xx.posted_at):'–'}</div><small>${xx?'last post':'nothing yet'} · daily</small></div>
   <div><div class="eyebrow">Ideas</div><div class="v">${V.paste.length}</div><small>read first at 06:20</small></div>`;
  // left: drafts
  const chans=[['all','All'],['linkedin','LinkedIn'],['x','X'],['dj','DJ LAV']];
  const inF=d=>filter==='all'||(filter==='dj'?d.track==='dj':d.channel===filter);
  const list=open.filter(inF);
  let l='';
  // the calendar: the next 7 days, every slot with what is planned, approved or posted in it (full width, Marco's week view)
  const AH=V.ahead||V.week,AS=AH.slots;
  const cell=(sl)=>{const d=D.find(x=>x.slot===sl.slot&&x.channel===sl.channel&&x.status!=='archived');const cls=!d?(sl.past?'e past':'e'):d.status==='posted'?'po':d.status==='approved'||d.status==='posting'?'ap':'pl';
    return `<div class="it ${cls}"><b>${sl.time} · ${L[sl.channel]}</b>${d?esc(cut(d.text.split('\n')[0],95)):(sl.past?'':'free')}</div>`};
  const planned=D.filter(d=>d.status==='open'&&d.slot&&!missed.has(d.id)).length;
  $('#calendar').innerHTML=`<div class="card"><div class="lab">Next 7 days<span class="r"><span class="legend"><span><i style="background:#fff8ec;border:1px solid #efdcbc"></i>planned</span><span><i style="background:var(--okbg)"></i>approved</span><span><i style="background:#e4e4e0"></i>posted</span></span></span></div>
    <div class="cal">${AH.days.map(day=>{const x=new Date(day+'T12:00:00Z');const ss=AS.filter(z=>z.day===day);return `<div class="day ${day===td?'td':''}"><h4>${day===td?'Today':DOW[x.getUTCDay()]+' '+x.getUTCDate()}</h4><div>${ss.map(cell).join('')||'<div class="small">no slot</div>'}</div></div>`}).join('')}</div>
    ${planned?`<div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="go" onclick="approvePlan()">Approve the plan (${planned} posts)</button><span class="small">or reply "go" in the Content HQ chat. DJ LAV slots start 1 December.</span></div>`:''}</div>`;
  if(appr.length)l+=`<div class="card"><div class="lab">Queued<span class="r">${appr.length} approved</span></div>${appr.map(card).join('')}</div>`;
  l+=`<div class="card"><div class="lab">Drafts<span class="r">${STATIC?'Buttons open WhatsApp with the command ready':''}</span></div><div class="chips">${chans.map(([k,n])=>`<button class="chip ${filter===k?'on':''}" onclick="filter='${k}';render()">${n}<i>${open.filter(d=>k==='all'||(k==='dj'?d.track==='dj':d.channel===k)).length}</i></button>`).join('')}</div>${list.length?list.map(card).join(''):'<p class="small">Nothing here. New drafts land at 06:20 from your calls, chats and the idea box.</p>'}</div>`;
  $('#left').innerHTML=l;
  // right: needs you, week, idea, posted
  let r='';const needs=[];
  if(need.length)needs.push(`<p><b>Connect ${need.map(c=>L[c]).join(' and ')}</b> in Upload-Post (Manage Users).</p>`);
  for(const d of ms)needs.push(`<p><b>${d.key||'A post'} missed ${when(d.slot)}.</b> ${esc(d.error||'')}<br><button class="txt" onclick="approve('${d.id}')">Move to next slot</button><button class="txt" onclick="archive('${d.id}')">Archive</button></p>`);
  if(needs.length)r+=`<div class="card need"><div class="lab">Needs you</div>${needs.join('')}</div>`;
  const rows=[['linkedin','LinkedIn'],['x','X'],['instagram','Instagram'],['tiktok','TikTok'],['youtube','YouTube']];
  if((V.focus||[]).length)r+=`<div class="card"><div class="lab">Focus<span class="r">${V.focus.length} ideas in circulation</span></div>${V.focus.map((f,n)=>`<div class="li" style="display:block"><b>F${n+1}.</b> ${esc(f.hook||'')}<div class="small" style="margin-top:2px">${esc(f.proof||'')}</div></div>`).join('')}<div class="small" style="margin-top:6px">Every draft comes from one of these. "done F2" retires one and the next best moves up.</div></div>`;
  r+=`<div class="card"><div class="lab">Idea box</div><div class="row"><input id="paste" placeholder="A link, a line or an idea" onkeydown="if(event.key==='Enter')savePaste()"><button onclick="savePaste()">Save</button></div><div class="small" style="margin-top:6px">Never posted. The 06:20 run writes from it first.</div>${V.paste.length?`<div style="margin-top:8px">${V.paste.map(p=>`<div class="li"><span>${esc(p.text.length>120?p.text.slice(0,120)+'…':p.text)}</span></div>`).join('')}</div>`:''}</div>`;
  if((V.inspo||[]).length)r+=`<div class="card"><div class="lab">Inspiration<span class="r">links you send yourself</span></div>${V.inspo.slice(0,5).map(x=>`<div class="li" style="display:block"><a href="${esc(x.url)}" target="_blank"><b>${esc(x.who||x.title||x.kind)}</b></a>${x.score?` <span class="tag">${x.score}</span>`:''}<div class="small" style="margin-top:2px">${esc(x.hook||x.summary||'')}</div></div>`).join('')}</div>`;
  if(posted.length)r+=`<div class="card"><div class="lab">Posted</div>${posted.slice(0,5).map(d=>`<div class="li"><span class="w">${L[d.channel]} ${dd(d.posted_at)}</span><a href="${esc(d.url)}" target="_blank">${esc(d.text.replace(/^Thread \(5 tweets\)\s*/,'Thread: ').slice(0,70))}…</a></div>`).join('')}</div>`;
  $('#right').innerHTML=r;
  $('#foot').textContent='From your phone: reply "approve L1 X1" in your WhatsApp self-chat. Drafts older than 7 days archive themselves.';
}
function card(d){
  const L=V.label,isO=openT.has(d.id);
  const st=d.status==='approved'?`<span class="tag ok">queued ${when(d.slot)}</span>`:'';
  const meta=`<b>${d.key||'Draft'}</b><span>${L[d.channel]}</span>${d.score?`<span>· ${d.score}/10</span>`:''}${d.channel==='x'?`<span style="${d.text.length>280?'color:var(--bad)':''}">· ${d.text.length}/280</span>`:''}${d.created!==todayD()?`<span class="tag">${+d.created.slice(8)} ${MON[+d.created.slice(5,7)-1]}</span>`:''}${st}${d.source&&!STATIC?`<span>· ${esc(d.source.split(';')[0])}</span>`:''}`;
  if(editing===d.id)return `<div class="d edit"><div class="meta">${meta}</div><textarea id="ed">${esc(d.text)}</textarea><div class="acts"><button class="go" onclick="saveEdit('${d.id}')">Save</button><button onclick="editing=null;render()">Cancel</button></div></div>`;
  const editBtn=`<button onclick="${STATIC?`wa('edit '+ref(byId('${d.id}'))+': '+byId('${d.id}').text)`:`editing='${d.id}';render()`}">Edit</button>`;
  const acts=d.status==='approved'?`${editBtn}<button onclick="archive('${d.id}')">Archive</button>`:`<button class="go" onclick="approve('${d.id}')">Approve</button>${editBtn}<button onclick="archive('${d.id}')">Archive</button>`;
  return `<div class="d"><div class="meta">${meta}</div><div class="acts">${acts}</div><div class="t ${d.text.length>320||d.text.split('\n').length>6?'long':''} ${isO?'open':''}" onclick="tg('${d.id}')" title="Click to expand">${esc(d.text)}</div></div>`;
}
function tg(id){openT.has(id)?openT.delete(id):openT.add(id);render()}
async function act(fn,msg){try{const r=await fn();toast(typeof msg==='function'?msg(r):msg);await load()}catch(e){toast(e.message)}}
const byId=id=>V.drafts.find(d=>d.id===id);
const cut=(t,n)=>t.length<=n?t:t.slice(0,n).replace(/\s+\S*$/,'')+'…';
const approvePlan=()=>STATIC?wa('approve plan'):act(()=>api('/plan/approve','POST',{}),r=>`${r.approved.length} posts approved into their slots`);
const approve=id=>STATIC?wa('approve '+ref(byId(id))):act(()=>api(`/drafts/${id}/approve`,'POST',{}),r=>`Approved for ${when(r.draft.slot)}`+(r.missing&&r.missing.length?`. Posts once ${V.label[r.draft.channel]} is connected.`:'.'));
const archive=id=>STATIC?wa('archive '+ref(byId(id))):act(()=>api(`/drafts/${id}`,'PATCH',{status:'archived'}),'Archived');
const saveEdit=id=>act(async()=>{const r=await api(`/drafts/${id}`,'PATCH',{text:$('#ed').value});editing=null;return r},'Saved');
const savePaste=()=>{const t=$('#paste').value.trim();if(!t)return;if(STATIC)return wa('idea: '+t);act(()=>api('/paste','POST',{text:t}),'Saved for tomorrow\'s run')};
load();setInterval(()=>{if(!editing)load()},60e3);
</script></body></html>
