<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Content HQ</title>
<!-- Phone first (hq/HQ-PRINCIPLES.md): one glanceable screen at 390px. Summary sentence, then a few cards with big tap targets.
     The self-chat is the control surface ("approve L1"); this page is for glancing and the odd edit. -->
<style>
:root{--bg:#f6f6f4;--card:#fff;--line:#e7e7e3;--text:#1b1b19;--muted:#86867f;--soft:#f0f0ec;--ok:#2d7a4c;--okbg:#e8f2ec;--warn:#9c5c16;--warnbg:#f8eee2;--bad:#b23b3b;--ink:#141413}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
a{color:inherit}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;min-height:44px;padding:0 16px}
button.go{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}button.txt{border:0;background:none;color:var(--muted);min-height:36px;padding:0 4px;font-size:14px}
header{display:flex;align-items:center;gap:6px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-weight:650;flex:1}header a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 8px}header a.on{color:var(--text);background:var(--soft);border-radius:8px}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
.sum{font-size:19px;line-height:1.4;margin:2px 0 18px;font-weight:500;letter-spacing:-.005em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}.lab span{margin-left:auto;letter-spacing:0;text-transform:none}
.need{border-color:#ecd9c2;background:#fffaf3}.need .lab{color:var(--warn)}.need p{margin:0 0 6px;font-size:15px}.need code{font-size:12.5px;background:var(--warnbg);padding:1px 5px;border-radius:4px;word-break:break-all}
.d{padding:12px 0;border-top:1px solid var(--line)}.lab+.d{border-top:0;padding-top:0}
.meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.meta b{color:var(--text)}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--soft)}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.w{background:var(--warnbg);color:var(--warn)}
.t{white-space:pre-wrap;font-size:15.5px;max-height:7.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}.t.open{max-height:none;-webkit-mask-image:none}
textarea{width:100%;min-height:220px;font:inherit;font-size:15.5px;border:1px solid var(--line);border-radius:12px;padding:12px}
.acts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:10px}.acts.two{grid-template-columns:1fr 1fr}
.n{font-size:14px;margin-top:6px}.n.w{color:var(--warn)}.n.ok{color:var(--ok)}.n.bad{color:var(--bad)}
.wk{display:grid;grid-template-columns:76px repeat(7,1fr);gap:4px;align-items:center;font-size:13px}.wk .h{text-align:center;color:var(--muted);font-size:11px}.wk .h.td{color:var(--text);font-weight:700}
.dot{height:22px;border-radius:6px;border:1px dashed #d5d5cf}.dot.f{background:var(--ok);border:0}.dot.past{opacity:.35}.dot.x{border:0}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px;font:inherit;font-size:16px;background:var(--bg)}
.small{font-size:13px;color:var(--muted)}.li{display:flex;gap:8px;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}.li:first-child{border-top:0}.li .w{color:var(--muted);flex:0 0 108px}
.toast{position:fixed;left:16px;right:16px;bottom:20px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:528px;margin:0 auto}.toast.show{opacity:1}
</style></head><body>
<header><b>Content HQ</b></header>
<main>
  <p class="sum" id="sum">Loading…</p>
  <div id="cards"></div>
</main><div class="toast" id="toast"></div>
<script>window.STATIC_DATA={"drafts":[{"id":"2026-11-26-L1","key":"L1","track":"zenith","channel":"linkedin","text":"Insurance covers a borrower who can't pay. It doesn't cover one who decides not to.\n\nMost emerging market structures break on that line.\n\nI was in a financing this week with local currency revenue and dollar debt. A public agency was going to guarantee minimum revenue. On paper, strong. In practice it was a memorandum, not a commitment, and the payment history was 14 years of waiting.\n\nSo we went to the insurer. Inability to pay is insurable. Arbitrary non-payment by a government is not.\n\nSo we went to the hedge. A rolling forward costs about 7% and likely isn't available at size. A non-deliverable forward settles net in cash, which does nothing when the central bank controls dollar conversion.\n\nEach layer was meant to cover the one before it. Each one had a hole in exactly the place the risk lives.\n\nThe fix is not a cleverer layer. It is a smaller deal, a senior piece the lender can actually underwrite, and a junior piece priced for the risk nobody can remove.\n\nA guarantee you can't enforce is a hope with a letterhead.","score":8.6,"created":"2026-11-26","status":"open","slot":null,"url":null,"error":null},{"id":"2026-11-26-L2","key":"L2","track":"zenith","channel":"linkedin","text":"The sponsor didn't want to own the collateral. The lender wouldn't lend unless someone did.\n\nThis stalled a vehicle financing I worked on this week. The sponsor wanted no liability, no equity and no assets on its books. Just the upside of running the fleet.\n\nThen the insurer said it needed an asset owner before it would write the guarantee. The export lender wanted 2.5x asset coverage. The local bank would not even talk until 20% equity was in.\n\nThree different counterparties asked for one thing. Someone has to be on the hook.\n\nThe revised plan is plain. A ring-fenced entity owns the vehicles. It sits under the parent but away from the core liabilities. The lender can repossess, the insurer has an owner to insure, and the sponsor's other businesses stay clear.\n\nIt took weeks to get there because everyone was hunting for a version where nobody owned anything.\n\nThat version doesn't exist. Credit moves risk, and risk has to land on a balance sheet. You only choose which one and how clean you make it.\n\nFounders ask me how to raise debt without giving anything up.\n\nIf you won't hold the risk, you are asking someone else to hold it for free.","score":8.4,"created":"2026-11-26","status":"open","slot":null,"url":null,"error":null},{"id":"2026-11-26-X1","key":"X1","track":"zenith","channel":"x","text":"Rev share beats cost-plus. When you split revenue, neither side has to calculate or audit the other's costs. Most partnership fights are an argument about whose costs are real.","score":7.8,"created":"2026-11-26","status":"open","slot":null,"url":null,"error":null},{"id":"2026-11-26-X2","key":"X2","track":"zenith","channel":"x","text":"Own the book, rent the license. The loans, the origination and the marketing are yours. The bank is just the licensed rails. Most lending partnerships get this backwards and hand the borrower to whoever holds the charter.","score":7.7,"created":"2026-11-26","status":"open","slot":null,"url":null,"error":null},{"id":"2026-11-26-X3","key":"X3","track":"zenith","channel":"x","text":"Most small credit funds don't die on returns. They die on runway before AUM gets big enough for fees to cover costs. Around 50 to 75M the burn mostly stops mattering. Until then the job is surviving, not performing.","score":7.6,"created":"2026-11-26","status":"open","slot":null,"url":null,"error":null},{"id":"2026-11-27-L1","key":"L1","track":"zenith","channel":"linkedin","text":"15% from a hotel developer looks like a great deal.\n\n18% looks even better.\n\nThen nobody forecast the UAE sitting under 2,000 missiles. Or think about lending to a shipping company and Hormuz closes for 6 months. Revenue stops overnight.\n\nThe coupon didn't change. The risk did.\n\nI keep seeing this with credit funds in the US and Australia. A lot of direct lending, priced for the world as it looked the day the term sheet was signed.\n\nThe question I care about now isn't the rate. It's what I can take back.\n\nReceivables. Equipment. Aircraft engines. A first lien on something real, and a team that knows how to go and get it.\n\nOver 5 years, some of these loans will go bad. That's not pessimism. It's the base rate.\n\nThe lender who planned for that takes the engines, re-leases them, and carries on with business as normal.\n\nThe lender who only priced the yield finds out what an unsecured 18% is really worth.\n\nYield is what you're promised. Recourse is what you get paid.","score":8.4,"created":"2026-11-27","status":"open","slot":null,"url":null,"error":null},{"id":"2026-11-27-L2","key":"L2","track":"zenith","channel":"linkedin","text":"\"Hi, I do CFO for businesses.\"\n\nThat was how I introduced myself for 12 months. Nobody knew what to do with it.\n\nI was doing a bit of everything. Bookkeeping, which someone will do for $5 an hour. CFO work for small companies. Whatever came in.\n\nAnd every client ended up saying some version of the same sentence.\n\n\"This is cool, but I just want to raise debt.\"\n\nSo I picked debt.\n\nNow the intro is: I help businesses doing $10 to $25 million in revenue raise around $10 million of asset-based finance, on a 2 to 4 year tenor.\n\nThat one sentence changed things on both sides of the table.\n\nFounders know in 5 seconds if it's them. You want $10M for your business? I call 20 lenders so you don't have to.\n\nLenders changed too. Banks and credit funds know what I bring them now, and they pick up the phone because the deals fit.\n\nThe last 6 months had more momentum than the 12 before them. Same person. Same network. Different sentence.\n\nA friend asked me this week how to fix their advisory business. They wanted to do value creation, transformation and strategy all at once.\n\nI told them what took me a year to hear. Pick the one thing a client actually pays to get done.\n\nA generalist gets referrals from nobody. A lane gets calls from both sides of the table.","score":8.3,"created":"2026-11-27","status":"open","slot":null,"url":null,"error":null},{"id":"2026-11-27-X1","key":"X1","track":"zenith","channel":"x","text":"I built a fintech tool. $50K in customer commitments. Then the customers started saying Claude can do it better. Software gets replaced in a quarter. A lending licence doesn't.","score":8,"created":"2026-11-27","status":"open","slot":null,"url":null,"error":null},{"id":"2026-11-27-X2","key":"X2","track":"zenith","channel":"x","text":"Lenders look at two things. Ability to pay and willingness to pay. A balance sheet only tells you about the first one.","score":7.9,"created":"2026-11-27","status":"open","slot":null,"url":null,"error":null},{"id":"2026-11-27-X3","key":"X3","track":"zenith","channel":"x","text":"Chinese banks wanted 2.5x asset cover. The sponsor's balance sheet couldn't show it. The fix wasn't a stronger balance sheet. It was an insurance bond that pays if the borrower doesn't, with the asset ring-fenced in an SPV.","score":7.7,"created":"2026-11-27","status":"open","slot":null,"url":null,"error":null}],"archived":0,"week":{"days":["2026-11-23","2026-11-24","2026-11-25","2026-11-26","2026-11-27","2026-11-28","2026-11-29"],"slots":[{"channel":"linkedin","day":"2026-11-23","time":"10:00","slot":"2026-11-23T10:00","filled":false,"past":true},{"channel":"x","day":"2026-11-23","time":"17:00","slot":"2026-11-23T17:00","filled":false,"past":true},{"channel":"x","day":"2026-11-24","time":"17:00","slot":"2026-11-24T17:00","filled":false,"past":true},{"channel":"instagram","day":"2026-11-24","time":"19:00","slot":"2026-11-24T19:00","filled":false,"past":true},{"channel":"tiktok","day":"2026-11-24","time":"19:30","slot":"2026-11-24T19:30","filled":false,"past":true},{"channel":"linkedin","day":"2026-11-25","time":"10:00","slot":"2026-11-25T10:00","filled":false,"past":true},{"channel":"x","day":"2026-11-25","time":"17:00","slot":"2026-11-25T17:00","filled":false,"past":true},{"channel":"x","day":"2026-11-26","time":"17:00","slot":"2026-11-26T17:00","filled":false,"past":true},{"channel":"linkedin","day":"2026-11-27","time":"10:00","slot":"2026-11-27T10:00","filled":false,"past":false},{"channel":"x","day":"2026-11-27","time":"17:00","slot":"2026-11-27T17:00","filled":false,"past":false},{"channel":"instagram","day":"2026-11-27","time":"19:00","slot":"2026-11-27T19:00","filled":false,"past":false},{"channel":"tiktok","day":"2026-11-27","time":"19:30","slot":"2026-11-27T19:30","filled":false,"past":false},{"channel":"x","day":"2026-11-28","time":"17:00","slot":"2026-11-28T17:00","filled":false,"past":false},{"channel":"x","day":"2026-11-29","time":"17:00","slot":"2026-11-29T17:00","filled":false,"past":false},{"channel":"instagram","day":"2026-11-29","time":"19:00","slot":"2026-11-29T19:00","filled":false,"past":false},{"channel":"youtube","day":"2026-11-29","time":"19:30","slot":"2026-11-29T19:30","filled":false,"past":false}]},"missed":[],"keys":{"linkedin":["UPLOAD_POST_API_KEY"],"x":["UPLOAD_POST_API_KEY"],"instagram":["UPLOAD_POST_API_KEY"],"tiktok":["UPLOAD_POST_API_KEY"],"youtube":["UPLOAD_POST_API_KEY"]},"label":{"linkedin":"LinkedIn","x":"X","instagram":"Instagram","tiktok":"TikTok","youtube":"YouTube"},"paste":[],"nextFree":{"channel":"linkedin","day":"2026-11-27","time":"10:00","slot":"2026-11-27T10:00"},"free":{"linkedin":["2026-11-27T10:00","2026-11-30T10:00","2026-12-02T10:00","2026-12-04T10:00","2026-12-07T10:00","2026-12-09T10:00","2026-12-11T10:00"],"x":["2026-11-27T17:00","2026-11-28T17:00","2026-11-29T17:00","2026-11-30T17:00","2026-12-01T17:00","2026-12-02T17:00","2026-12-03T17:00","2026-12-04T17:00","2026-12-05T17:00","2026-12-06T17:00","2026-12-07T17:00","2026-12-08T17:00","2026-12-09T17:00","2026-12-10T17:00","2026-12-11T17:00","2026-12-12T17:00","2026-12-13T17:00"],"instagram":["2026-11-27T19:00","2026-11-29T19:00","2026-12-01T19:00","2026-12-04T19:00","2026-12-06T19:00","2026-12-08T19:00","2026-12-11T19:00","2026-12-13T19:00"],"tiktok":["2026-11-27T19:30","2026-12-01T19:30","2026-12-04T19:30","2026-12-08T19:30","2026-12-11T19:30"],"youtube":["2026-11-29T19:30","2026-12-06T19:30","2026-12-13T19:30"]},"now":"2026-11-27T05:41:13.294Z"};</script>
<script>
const $=s=>document.querySelector(s);let V=null,editing=null,more=false,openT=new Set();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),3500)};
async function api(p,m='GET',b){const r=await fetch('/api/content'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const when=s=>{const d=new Date(s.slice(0,10)+'T12:00:00Z');return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${s.slice(11,16)}`};
const todayD=()=>new Date(Date.now()+4*36e5).toISOString().slice(0,10);
// Static copy on midascfo.com/content-hq (window.STATIC_DATA baked in by content.js): buttons open WhatsApp with the command typed, he sends it to himself
const STATIC=!!window.STATIC_DATA;
const ref=d=>(d.key||d.id)+(d.created===todayD()?'':'@'+(+d.created.slice(8)));
const wa=t=>{location.href='https://wa.me/?text='+encodeURIComponent(t)};
async function load(){if(STATIC){V=window.STATIC_DATA;render();return}try{V=await api('');render()}catch(e){$('#sum').textContent='Could not load: '+e.message}}
function render(){
  const D=V.drafts,L=V.label,missed=new Set(V.missed),W=V.week.slots;
  const open=D.filter(d=>d.status==='open'&&!missed.has(d.id)).sort((a,b)=>(b.created>a.created?1:b.created<a.created?-1:0)||(a.channel==='linkedin'?-1:1)-(b.channel==='linkedin'?-1:1)||(b.score||0)-(a.score||0));
  const appr=D.filter(d=>['approved','posting'].includes(d.status)&&!missed.has(d.id)).sort((a,b)=>a.slot>b.slot?1:-1);
  const posted=D.filter(d=>d.status==='posted').sort((a,b)=>(b.posted_at||'')>(a.posted_at||'')?1:-1);
  const filled=W.filter(s=>s.filled).length,need=['linkedin','x'].filter(ch=>V.keys[ch].length),ms=D.filter(d=>missed.has(d.id));
  // one sentence: where things stand and the single next move
  let s=open.length?`${open.length} draft${open.length>1?'s':''} waiting for you`:'No drafts waiting';
  s+=appr.length?`, ${appr.length} approved and queued`:'';
  s+=`. ${filled} of this week's ${W.length} slots filled.`;
  s+=need.length?` Nothing can post until ${need.map(c=>L[c]).join(' and ')} ${need.length>1?'are':'is'} connected.`:appr.length?` Next out: ${L[appr[0].channel]} ${when(appr[0].slot)}.`:'';
  $('#sum').textContent=s;
  let h='';
  // 1. Needs you: only when something is blocking
  const needs=[];
  if(need.length){const noKey=need.some(c=>V.keys[c].includes('UPLOAD_POST_API_KEY'));needs.push(noKey?`<p><b>Connect Upload-Post.</b> Send its API key to the mini through the secrets inbox on the laptop as <code>UPLOAD_POST_API_KEY</code>. Then you get login links for LinkedIn and X in your self-chat.</p>`:`<p><b>Log in to ${need.map(c=>L[c]).join(' and ')}.</b> The link is in your self-chat (it lasts 48 hours, a new one comes after that).</p>`)}
  for(const d of ms)needs.push(`<p><b>${d.key||'A post'} missed ${when(d.slot)}.</b> ${esc(d.error||'')} <button class="txt" onclick="approve('${d.id}')">Move to next slot</button><button class="txt" onclick="archive('${d.id}')">Archive</button></p>`);
  if(needs.length)h+=`<div class="card need"><div class="lab">Needs you</div>${needs.join('')}</div>`;
  // 2. Up next: the best few, approve by tap (same as "approve L1" in the self-chat)
  const show=more?open:open.slice(0,2);
  h+=`<div class="card"><div class="lab">Up next<span>${open.length>2?`<button class="txt" onclick="more=!more;render()">${more?'Show fewer':`+${open.length-2} more`}</button>`:''}</span></div>${show.length?show.map(card).join(''):'<p class="small" style="margin:0">Nothing waiting. New drafts land at 06:20 from your calls, voice notes and the idea box below.</p>'}</div>`;
  // 3. This week: approved queue + a dot grid
  const td=todayD(),rows=[['linkedin','LinkedIn'],['x','X'],['instagram','Instagram'],['tiktok','TikTok'],['youtube','YouTube']];
  let g=`<div class="wk"><div></div>${V.week.days.map(d=>{const x=new Date(d+'T12:00:00Z');return `<div class="h ${d===td?'td':''}">${DOW[x.getUTCDay()][0]}<br>${x.getUTCDate()}</div>`}).join('')}`;
  for(const[ch,l]of rows){g+=`<div>${l}</div>`;for(const d of V.week.days){const sl=W.find(z=>z.channel===ch&&z.day===d);g+=`<div class="dot ${!sl?'x':sl.filled?'f':sl.past?'past':''}" title="${sl?sl.time:''}"></div>`}}
  g+='</div>';
  h+=`<div class="card"><div class="lab">This week<span>${filled} of ${W.length} filled</span></div>${appr.length?appr.map(d=>`<div class="li"><span class="w">${when(d.slot)}</span><span>${L[d.channel]} · ${esc(d.text.slice(0,48))}…</span></div>`).join('')+'<div style="height:10px"></div>':''}${g}<div class="small" style="margin-top:8px">${V.nextFree?`Next free: ${when(V.nextFree.slot)} ${L[V.nextFree.channel]}. `:''}Dubai time. Zenith: LinkedIn and X. DJ LAV: Instagram, TikTok, YouTube.</div></div>`;
  // 4. Idea box
  h+=`<div class="card"><div class="lab">Idea</div><div class="row"><input id="paste" placeholder="A link, a line or an idea" enterkeyhint="send" onkeydown="if(event.key==='Enter')savePaste()"><button onclick="savePaste()">Save</button></div><div class="small" style="margin-top:6px">Never posted. Tomorrow's 06:20 run writes from it first. Voice notes to your self-chat work too.</div>${V.paste.length?`<div style="margin-top:10px">${V.paste.map(p=>`<div class="li"><span>${esc(p.text.length>140?p.text.slice(0,140)+'…':p.text)}</span></div>`).join('')}</div>`:''}</div>`;
  // 5. Posted
  if(posted.length)h+=`<div class="card"><div class="lab">Posted</div>${posted.slice(0,3).map(d=>`<div class="li"><span class="w">${L[d.channel]}</span><a href="${esc(d.url)}" target="_blank">${esc(d.text.slice(0,50))}…</a></div>`).join('')}</div>`;
  h+=`<p class="small" style="text-align:center">From your phone: reply <b>approve L1 X1</b> in your self-chat. Drafts older than 7 days archive themselves.</p>`;
  if(STATIC)h+=`<p class="small" style="text-align:center">Updated ${new Date(V.now).toLocaleString('en-GB',{timeZone:'Asia/Dubai',weekday:'short',hour:'2-digit',minute:'2-digit'})} Dubai. Buttons open WhatsApp with the command ready: send it to yourself.</p>`;
  $('#cards').innerHTML=h;
}
function card(d){
  const L=V.label,isO=openT.has(d.id);
  const meta=`<b>${d.key||'Draft'}</b><span>${L[d.channel]}</span>${d.score?`<span>· ${d.score}/10</span>`:''}${d.channel==='x'?`<span style="${d.text.length>280?'color:var(--bad)':''}">· ${d.text.length}/280</span>`:''}${d.created!==todayD()?`<span class="tag">${d.created.slice(8)} ${MON[+d.created.slice(5,7)-1]}</span>`:''}`;
  if(editing===d.id)return `<div class="d"><div class="meta">${meta}</div><textarea id="ed">${esc(d.text)}</textarea><div class="acts two"><button class="go" onclick="saveEdit('${d.id}')">Save</button><button onclick="editing=null;render()">Cancel</button></div></div>`;
  return `<div class="d"><div class="meta">${meta}</div><div class="t ${isO?'open':''}" onclick="tg('${d.id}')">${esc(d.text)}</div>${d.source?`<div class="small" style="margin-top:4px">${esc(d.source.split(';')[0])}</div>`:''}<div class="acts"><button class="go" onclick="approve('${d.id}')">Approve</button><button onclick="${STATIC?`wa('edit '+ref(byId('${d.id}'))+': '+byId('${d.id}').text)`:`editing='${d.id}';render()`}">Edit</button><button onclick="archive('${d.id}')">Archive</button></div></div>`;
}
function tg(id){openT.has(id)?openT.delete(id):openT.add(id);render()}
async function act(fn,msg){try{const r=await fn();toast(typeof msg==='function'?msg(r):msg);await load()}catch(e){toast(e.message)}}
const byId=id=>V.drafts.find(d=>d.id===id);
const approve=id=>STATIC?wa('approve '+ref(byId(id))):act(()=>api(`/drafts/${id}/approve`,'POST',{}),r=>`Approved for ${when(r.draft.slot)}`+(r.missing&&r.missing.length?`. Posts once ${V.label[r.draft.channel]} is connected.`:'.'));
const archive=id=>STATIC?wa('archive '+ref(byId(id))):act(()=>api(`/drafts/${id}`,'PATCH',{status:'archived'}),'Archived');
const saveEdit=id=>act(async()=>{const r=await api(`/drafts/${id}`,'PATCH',{text:$('#ed').value});editing=null;return r},'Saved');
const savePaste=()=>{const t=$('#paste').value.trim();if(!t)return;if(STATIC)return wa('idea: '+t);act(()=>api('/paste','POST',{text:t}),'Saved for tomorrow\'s run')};
load();setInterval(()=>{if(!editing)load()},60e3);
</script></body></html>
